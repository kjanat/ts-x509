name: Deploy Site

on: { push: { branches: [master, vitepress] }, workflow_dispatch: null }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 5
    steps: [
      { uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1, with: { persist-credentials: false } }, # v7
      { uses: $/.github/actions/setup-ts, with: { install-bun: true, install-deno: true } },
      { run: runner install -f site:build, env: { GITHUB_TOKEN: "${{ github.token }}" } },
      { name: Verify import maps, run: run site:import-maps },
      { uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9, with: { path: site/.vitepress/dist } }, # v5
    ]

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ name: Deploy to GitHub Pages, id: deployment, uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 }] # v5
